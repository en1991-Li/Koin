<section id="page-add-record" class="page">
    <header class="nav-header">
        <i data-lucide="x" class="s-icon" onclick="showPage('page-calendar')"></i>
        <h1 class="page-title">新增記錄</h1>
        <i data-lucide="check" class="s-icon" onclick="saveRecord()"></i>
    </header>

    <div class="content-scroll no-scrollbar" style="padding-bottom: 280px;">
        <div class="record-tabs" id="record-type-tabs" style="display: flex; overflow-x: auto; padding: 15px; gap: 20px; color: #8a8a8e;">
            <span class="active text-blue" onclick="setRecordType('支出', this)">支出</span>
            <span onclick="setRecordType('收入', this)">收入</span>
            <span onclick="setRecordType('轉帳', this)">轉帳</span>
            <span onclick="setRecordType('應收款項', this)">應收款項</span>
        </div>

        <div class="brand-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 10px 20px;">
            <div class="brand-item" onclick="quickSelectBrand('7-11', '生活開銷')"><div class="brand-icon">🏪</div><p>7-11</p></div>
            <div class="brand-item" onclick="quickSelectBrand('麥當勞', '生活開銷')"><div class="brand-icon">🍔</div><p>麥當勞</p></div>
            <div class="brand-item" onclick="quickSelectBrand('全家', '生活開銷')"><div class="brand-icon">🏪</div><p>全家</p></div>
            <div class="brand-item" onclick="quickSelectBrand('可不可', '生活開銷')"><div class="brand-icon">🥤</div><p>可不可</p></div>
        </div>

        <div class="record-form" style="padding: 0 20px;">
            <div class="amount-input-box" onclick="toggleCalculator(true)" style="background: #2c2c3e; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                <span style="background: #3d3d4d; padding: 5px 12px; border-radius: 8px;">TWD</span>
                <span style="font-size: 28px; font-weight: bold; display: flex; align-items: center; gap: 5px;">
                    <span id="record-amount-display">0</span>
                    <span style="font-size: 18px; color: #5d5dff;" id="calc-operator-indicator"></span>
                </span>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <div class="form-btn" id="btn-select-account" onclick="openRecordAccountPicker()">錢包</div>
                <div class="form-btn" id="btn-select-project" onclick="openRecordProjectPicker()">生活開銷</div>
                <div class="form-btn" id="btn-select-date" onclick="openRecordDatePicker()">今天</div>
                <div class="form-btn" id="btn-select-time" onclick="openRecordTimePicker()">現在</div>
            </div>

            <textarea id="record-note" placeholder="備註事項..." style="width: 100%; background: #2c2c3e; border: none; border-radius: 12px; color: white; padding: 15px; margin-top: 15px; min-height: 80px; outline: none; resize: none;"></textarea>
            
            <div class="form-btn" style="margin-top: 10px; background: #232332; color: #8a8a8e; text-align: center;" onclick="openModal('record-advanced-modal')">
                <i data-lucide="sliders" style="width:14px; display:inline-block; vertical-align:middle; margin-right:5px;"></i> 進階設定 (週期/分期)
            </div>
         </div>
     </div>

    <div id="inline-calculator" class="inline-calc-container" style="display: none;">
        <div class="calc-quick-bar" id="calc-quick-suggestions">
            <span onclick="pressCalc('137')">137</span>
            <span onclick="pressCalc('89')">89</span>
            <span onclick="pressCalc('80')">80</span>
            <span onclick="pressCalc('69')">69</span>
            <span onclick="pressCalc('20')">20</span>
        </div>
        <div class="calc-grid">
            <div class="calc-btn op" onclick="pressCalc('÷')">÷</div>
            <div class="calc-btn op" onclick="pressCalc('×')">×</div>
            <div class="calc-btn op" onclick="pressCalc('-')">-</div>
            <div class="calc-btn op" onclick="pressCalc('+')">+</div>
            
            <div class="calc-btn" onclick="pressCalc('7')">7</div>
            <div class="calc-btn" onclick="pressCalc('8')">8</div>
            <div class="calc-btn" onclick="pressCalc('9')">9</div>
            <div class="calc-btn op" onclick="pressCalc('backspace')"><i data-lucide="delete" style="width:18px;"></i></div>
            
            <div class="calc-btn" onclick="pressCalc('4')">4</div>
            <div class="calc-btn" onclick="pressCalc('5')">5</div>
            <div class="calc-btn" onclick="pressCalc('6')">6</div>
            <div class="calc-btn op" onclick="pressCalc('C')">C</div>
            
            <div class="calc-btn" onclick="pressCalc('1')">1</div>
            <div class="calc-btn" onclick="pressCalc('2')">2</div>
            <div class="calc-btn" onclick="pressCalc('3')">3</div>
            <div class="calc-btn confirm-btn" style="grid-row: span 2;" onclick="pressCalc('done')"><i data-lucide="corner-down-left" style="width:20px;"></i></div>
            
            <div class="calc-btn" style="grid-column: span 2;" onclick="pressCalc('0')">0</div>
            <div class="calc-btn" onclick="pressCalc('.')">.</div>
        </div>
    </div>
</section>

<div id="record-account-modal" class="modal-overlay" style="display: none;" onclick="closeModal('record-account-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">選擇收付款帳戶</div>
        <div style="padding: 0 15px 10px 15px;">
            <input type="text" id="account-search-input" placeholder="🔍 搜尋帳戶名稱..." oninput="filterRecordAccounts(this.value)" style="width:100%; background:#2c2c3e; border:none; padding:10px; border-radius:8px; color:white; outline:none;">
        </div>
        <div class="modal-options" id="record-account-options" style="max-height: 250px; overflow-y: auto;"></div>
        <div class="modal-footer"><button onclick="closeModal('record-account-modal')">取消</button></div>
    </div>
</div>

<div id="record-project-modal" class="modal-overlay" style="display: none;" onclick="closeModal('record-project-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">歸屬記帳專案</div>
        <div style="padding: 0 15px 10px 15px;">
            <input type="text" id="project-search-input" placeholder="🔍 搜尋專案名稱..." oninput="filterRecordProjects(this.value)" style="width:100%; background:#2c2c3e; border:none; padding:10px; border-radius:8px; color:white; outline:none;">
        </div>
        <div class="modal-options" id="record-project-options" style="max-height: 250px; overflow-y: auto;"></div>
        <div class="modal-footer"><button onclick="closeModal('record-project-modal')">取消</button></div>
    </div>
</div>

<div id="record-advanced-modal" class="modal-overlay" style="display: none;" onclick="closeModal('record-advanced-modal')">
    <div class="modal-content" onclick="event.stopPropagation()" style="padding: 20px;">
        <div class="modal-header" style="border:none;">進階設定</div>
        <div class="detail-tabs" style="margin-bottom: 15px;">
            <div class="detail-tab active" id="adv-tab-single" onclick="switchAdvancedTab('single')">單次</div>
            <div class="detail-tab" id="adv-tab-cycle" onclick="switchAdvancedTab('cycle')">週期</div>
            <div class="detail-tab" id="adv-tab-install" onclick="switchAdvancedTab('install')">分期</div>
        </div>
        <div id="adv-content-area" style="min-height: 100px; color: #8a8a8e; font-size: 14px; padding: 10px 5px;">
            <div id="adv-pane-single">入帳方式：立即入帳</div>
            <div id="adv-pane-cycle" style="display:none;">重複頻率：每個月固定本日</div>
            <div id="adv-pane-install" style="display:none;">分期期數：<input type="number" value="3" style="width:50px; background:#2c2c3e; border:none; color:white; text-align:center; border-radius:4px;"> 期</div>
        </div>
        <div class="modal-footer" style="border:none; gap:10px;">
            <button onclick="closeModal('record-advanced-modal')">取消</button>
            <button class="btn-confirm" style="background:#3d3d4d;" onclick="closeModal('record-advanced-modal')">確定</button>
        </div>
    </div>
</div>

<div id="record-time-modal" class="modal-overlay" style="display: none;" onclick="closeModal('record-time-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">選擇時間</div>
        <div style="display:flex; justify-content:center; gap:20px; padding: 20px 0;">
            <div>時：<input type="number" id="input-record-hour" min="0" max="23" style="width:60px; font-size:20px; background:#2c2c3e; color:white; border:none; text-align:center; padding:5px; border-radius:6px;"></div>
            <div>分：<input type="number" id="input-record-minute" min="0" max="59" style="width:60px; font-size:20px; background:#2c2c3e; color:white; border:none; text-align:center; padding:5px; border-radius:6px;"></div>
        </div>
        <div class="modal-footer" style="border:none;"><button class="btn-confirm" style="background:#3d3d4d; width:100%;" onclick="confirmRecordTime()">確定</button></div>
    </div>
</div>
